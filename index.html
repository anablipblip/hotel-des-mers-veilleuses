
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hôtel des Mers Veilleuses</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<section class="surface">

<header class="titre">
<h1>Hôtel des Mers Veilleuses</h1>
<p>Chaque fenêtre deviendra un portail.</p>
</header>

<div class="hotel-placeholder">

<div class="cadre-facade">

<img
src="assets/oeuvres/facade-master.jpg"
alt="Façade de l'Hôtel des Mers Veilleuses"
class="facade">
<div class="veilleuse lucarne-gauche"></div>
<div class="veilleuse lucarne-droite"></div>

<div class="veilleuse fenetre-gauche"></div>
<div class="veilleuse fenetre-droite"></div>

<div class="veilleuse porte"></div>
<svg class="facade-map"
viewBox="0 0 744 1052"
preserveAspectRatio="none">

<g class="portal-group" data-word="Respirer">
<a href="#respirer">
<ellipse class="portal" cx="188" cy="238" rx="34" ry="46"/>
<text class="portal-label" x="188" y="170">Respirer</text>
</a>
</g>

<g class="portal-group" data-word="Croître">
<a href="#croitre">
<ellipse class="portal" cx="556" cy="238" rx="34" ry="46"/>
<text class="portal-label" x="556" y="170">Croître</text>
</a>
</g>

<g class="portal-group" data-word="Veiller">
<a href="#veiller">
<path class="portal"
d="M214 320 Q214 282 250 282 Q286 282 286 320 L286 540 L214 540 Z"/>
<text class="portal-label" x="250" y="260">Veiller</text>
</a>
</g>

<g class="portal-group" data-word="Étreindre">
<a href="#etreindre">
<path class="portal"
d="M458 320 Q458 282 494 282 Q530 282 530 320 L530 540 L458 540 Z"/>
<text class="portal-label" x="494" y="260">Étreindre</text>
</a>
</g>

<g class="portal-group" data-word="Plonger">
<a href="#plonger">
<path class="portal"
d="M338 505 Q338 455 372 455 Q406 455 406 505 L406 710 L338 710 Z"/>
<text class="portal-label" x="372" y="435">Plonger</text>
</a>
</g>

</svg>

</div>

</div>

<div class="vagues">
<svg viewBox="0 0 1200 90" preserveAspectRatio="none">
<path d="M0 55 C120 40 220 70 340 55 C470 40 570 70 690 55 C820 40 930 70 1050 55 C1120 48 1160 60 1200 55"/>
</svg>
</div>

<p class="invitation">Glisser vers les profondeurs</p>

</section>

<section id="respirer" class="palier">
<div class="palier-contenu">
<h2>Respirer</h2>
<p>Ici viendront les premières œuvres baignées de lumière.</p>
</div>
</section>

<section id="croitre" class="palier">
<div class="palier-contenu">
<h2>Croître</h2>
</div>
</section>

<section id="veiller" class="palier">
<div class="palier-contenu">
<h2>Veiller</h2>
</div>
</section>

<section id="etreindre" class="palier">
<div class="palier-contenu">
<h2>Étreindre</h2>
</div>
</section>

<section id="plonger" class="palier">
<div class="palier-contenu">
<h2>Plonger</h2>
</div>
</section>

</body>

<script src="script.js"></script>

</html>
