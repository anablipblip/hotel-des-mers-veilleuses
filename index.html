
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hôtel des Mers Veilleuses</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="surface">

<header class="titre">
<h1>Hôtel des Mers Veilleuses</h1>
<p>Chaque fenêtre deviendra un portail.</p>
</header>

<div class="hotel-placeholder">

<div class="cadre-facade">

<img
src="assets/oeuvres/facade-master.jpg"
alt="Façade de l'Hôtel des Mers Veilleuses"
class="facade">

<!-- Veilleuses -->

<div class="veilleuse lucarne-gauche" data-word="Respirer"></div>
<div class="veilleuse lucarne-droite" data-word="Croître"></div>

<div class="veilleuse fenetre-gauche" data-word="Veiller"></div>
<div class="veilleuse fenetre-droite" data-word="Étreindre"></div>

<div class="veilleuse fenetre-centrale" data-word="Plonger"></div>

<div class="veilleuse porte" data-word="La Gardienne"></div>

<!-- Carte invisible -->


<object
  class="facade-map"
  data="facade-map.svg"
  type="image/svg+xml"
  aria-label="Carte interactive de la façade">
</object>

</div>

</div>

<div class="vagues"></div>

<div class="invitation">
Glisser vers les profondeurs
</div>

</section>

<section id="respirer" class="palier">
<div class="palier-contenu">
<h2>Respirer</h2>
</div>
</section>

<section id="croitre" class="palier">
<div class="palier-contenu">
<h2>Croître</h2>
</div>
</section>

<section id="veiller" class="palier">
<div class="palier-contenu">
<h2>Veiller</h2>
</div>
</section>

<section id="etreindre" class="palier">
<div class="palier-contenu">
<h2>Étreindre</h2>
</div>
</section>

<section id="plonger" class="palier">
<div class="palier-contenu">
<h2>Plonger</h2>
</div>
</section>

<section id="gardienne" class="palier">
<div class="palier-contenu">
<h2>La Gardienne</h2>
</div>
</section>

<script src="script.js"></script>

</body>
</html>
