<!DOCTYPE html>
<html lang="fr">
<head>

<title>Hôtel des Mers Veilleuses</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>

<body>

<section class="surface">

  <header class="titre">
    <h1>Hôtel des Mers Veilleuses</h1>
    <p>Chaque fenêtre deviendra un portail.</p>
  </header>

  <div class="hotel-placeholder">

<div class="cadre-facade">

  <div class="hotel-interactif">

    <img
      src="assets/oeuvres/facade-master.jpg"
      alt="Façade de l'Hôtel des Mers Veilleuses"
      class="facade"
    >

    <button class="fenetre lucarne-gauche">Plonger</button>
    <button class="fenetre lucarne-droite">Respirer</button>

    <button class="fenetre grande-gauche">Croître</button>
    <button class="fenetre grande-centre">Veiller</button>
    <button class="fenetre grande-droite">Étreindre</button>

  </div>

</div>

  </div>

<div class="invitation">
  Glisser vers les profondeurs
</div>

</section>
