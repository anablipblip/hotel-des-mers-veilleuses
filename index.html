<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hôtel des Mers Veilleuses</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>

<body>

<section class="surface">

  <header class="titre">
    <h1>Hôtel des Mers Veilleuses</h1>
    <p>Chaque fenêtre deviendra un portail.</p>
  </header>

  <div class="hotel-placeholder">

<div class="cadre-facade">

  <img src="assets/facade-master.jpg"
       alt="Façade de l'Hôtel des Mers Veilleuses"
       class="facade">
</div>

<button class="fenetre lucarne-gauche" data-label="Plonger"></button>
<button class="fenetre lucarne-droite" data-label="Respirer"></button>

<button class="fenetre grande-gauche" data-label="Croître"></button>
<button class="fenetre grande-centre" data-label="Veiller"></button>
<button class="fenetre grande-droite" data-label="Étreindre"></button>

  </div>

</div>

  </div>
<div class="waves-container">

  <svg class="waves" viewBox="0 0 1200 220" preserveAspectRatio="none">

    <path class="wave1"
      d="M0,120 C120,90 240,150 360,120 C480,90 600,150 720,120 C840,90 960,150 1080,120 C1140,105 1180,118 1200,120"/>

    <path class="wave2"
      d="M0,155 C150,135 300,175 450,155 C600,135 750,175 900,155 C1050,135 1140,165 1200,155"/>

  </svg>

</div>
<div class="invitation">
  Glisser vers les profondeurs
</div>

</section>
  
<div class="veilleuse"></div>
  
<script src="script.js"></script>
</body>
</html>
