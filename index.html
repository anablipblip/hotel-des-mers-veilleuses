
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hôtel des Mers Veilleuses</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="surface">

<header class="titre">
<h1>Hôtel des Mers Veilleuses</h1>
<p>Chaque fenêtre deviendra un portail.</p>
</header>

<div class="hotel-placeholder">

<div class="cadre-facade">

<img
src="assets/oeuvres/facade-master.jpg"
alt="Façade de l'Hôtel des Mers Veilleuses"
class="facade">

<!-- Veilleuses -->

<div class="veilleuse lucarne-gauche" data-word="Respirer"></div>
<div class="veilleuse lucarne-droite" data-word="Croître"></div>

<div class="veilleuse fenetre-gauche" data-word="Veiller"></div>
<div class="veilleuse fenetre-droite" data-word="Étreindre"></div>

<div class="veilleuse fenetre-centrale" data-word="Plonger"></div>

<div class="veilleuse porte" data-word="La Gardienne"></div>

<!-- Carte invisible -->

<svg class="facade-map"
viewBox="0 0 744 1052"
preserveAspectRatio="none">

<!-- Lucarne gauche -->

<a href="#respirer">
<circle class="portal"
cx="162"
cy="176"
r="30"/>
</a>

<!-- Lucarne droite -->

<a href="#croitre">
<circle class="portal"
cx="582"
cy="176"
r="30"/>
</a>

<!-- Grande fenêtre gauche -->

<a href="#veiller">
<path class="portal"
d="M182 292
Q182 246 228 246
Q274 246 274 292
L274 522
L182 522 Z"/>
</a>

<!-- Grande fenêtre droite -->

<a href="#etreindre">
<path class="portal"
d="M470 292
Q470 246 516 246
Q562 246 562 292
L562 522
L470 522 Z"/>
</a>

<!-- Fenêtre centrale -->

<a href="#plonger">
<path class="portal"
d="M320 402
Q320 350 372 350
Q424 350 424 402
L424 610
L320 610 Z"/>
</a>

<!-- Lucarne de porte -->

<a href="#gardienne">
<path class="portal"
d="M346 650
Q346 620 372 620
Q398 620 398 650
L398 718
L346 718 Z"/>
</a>

</svg>

</div>

</div>

<div class="vagues"></div>

<div class="invitation">
Glisser vers les profondeurs
</div>

</section>

<section id="respirer" class="palier">
<div class="palier-contenu">
<h2>Respirer</h2>
</div>
</section>

<section id="croitre" class="palier">
<div class="palier-contenu">
<h2>Croître</h2>
</div>
</section>

<section id="veiller" class="palier">
<div class="palier-contenu">
<h2>Veiller</h2>
</div>
</section>

<section id="etreindre" class="palier">
<div class="palier-contenu">
<h2>Étreindre</h2>
</div>
</section>

<section id="plonger" class="palier">
<div class="palier-contenu">
<h2>Plonger</h2>
</div>
</section>

<section id="gardienne" class="palier">
<div class="palier-contenu">
<h2>La Gardienne</h2>
</div>
</section>

<script src="script.js"></script>

</body>
</html>
