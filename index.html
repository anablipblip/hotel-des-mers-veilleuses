<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hôtel des Mers Veilleuses</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<body>

<section class="surface">

  <header class="titre">
    <h1>Hôtel des Mers Veilleuses</h1>
    <p>Chaque fenêtre deviendra un portail.</p>
  </header>

  <div class="hotel-placeholder">

<div class="cadre-facade">

  <img
    src="assets/oeuvres/facade-master.jpg"
    alt="Façade de l'Hôtel des Mers Veilleuses"
    class="facade">

  <svg class="facade-map"
       viewBox="0 0 744 1052"
       preserveAspectRatio="none">

    <circle class="portal respirer"
            cx="188" cy="236" r="34"
            data-title="Respirer"/>

    <circle class="portal veiller"
            cx="553" cy="236" r="34"
            data-title="Veiller"/>

    <path class="portal croitre"
      data-title="Croître"
      d="M112 430
         Q112 370 160 370
         Q208 370 208 430
         L208 590
         L112 590 Z"/>

    <path class="portal etreindre"
      data-title="Étreindre"
      d="M536 430
         Q536 370 584 370
         Q632 370 632 430
         L632 590
         L536 590 Z"/>

    <path class="portal plonger"
      data-title="Plonger"
      d="M318 640
         Q318 590 372 590
         Q426 590 426 640
         L426 790
         L318 790 Z"/>

  </svg>

</div>

    <div class="waves-container">

      <svg class="waves" viewBox="0 0 1200 220" preserveAspectRatio="none">

        <path class="wave1"
          d="M0,120
             C120,90 240,150 360,120
             C480,90 600,150 720,120
             C840,90 960,150 1080,120
             C1140,105 1180,118 1200,120"/>

        <path class="wave2"
          d="M0,155
             C150,135 300,175 450,155
             C600,135 750,175 900,155
             C1050,135 1140,165 1200,155"/>

      </svg>

    </div>

  </div>

  <div class="invitation">
    glisser vers les profondeurs
  </div>

</section>

<section id="respirer" class="palier">
  <div class="palier-contenu">
    <h2>Respirer</h2>
  </div>
</section>

<section id="croitre" class="palier">
  <div class="palier-contenu">
    <h2>Croître</h2>
  </div>
</section>

<section id="veiller" class="palier">
  <div class="palier-contenu">
    <h2>Veiller</h2>
  </div>
</section>

<section id="etreindre" class="palier">
  <div class="palier-contenu">
    <h2>Étreindre</h2>
  </div>
</section>

<section id="plonger" class="palier">
  <div class="palier-contenu">
    <h2>Plonger</h2>
  </div>
</section>

<script src="script.js"></script>

</body>
</html>
